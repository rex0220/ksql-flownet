schema_version: 1
network_id: m7_rerun_nonidem2
description: M7 rerun-from fixture with an executed non-idempotent node
business_key_policy:
  type: explicit
max_active_runs: 1
network_lock:
  lease_duration_sec: 60
  heartbeat_interval_sec: 15
nodes:
  - id: n1_extract
    job_id: m6_read_customers
    sql: jobs/m6-read-customers.sql
    depends_on: []
    trigger_rule: all_success
    idempotent: true
  - id: n3_notify
    job_id: m6_read_deals
    sql: jobs/m6-read-deals.sql
    depends_on: [n1_extract]
    trigger_rule: all_success
    idempotent: false
  - id: n4_fail
    job_id: m7_rerun_fail
    sql: jobs/m7-rerun-fail.sql
    depends_on: [n3_notify]
    trigger_rule: all_success
    idempotent: true
