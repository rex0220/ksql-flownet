schema_version: 1
network_id: m8_brake
description: M8 deterministic retry-brake fixture
business_key_policy:
  type: explicit
max_active_runs: 1
network_lock:
  lease_duration_sec: 60
  heartbeat_interval_sec: 15
nodes:
  - id: n1_deterministic_fail
    job_id: m8_brake_fail
    sql: jobs/m8-brake-fail.sql
    depends_on: []
    trigger_rule: all_success
    idempotent: true
  - id: n2_independent
    job_id: m8_brake_independent
    sql: jobs/m8-brake-independent.sql
    depends_on: []
    trigger_rule: all_success
    idempotent: true
