schema_version: 1
network_id: m5_midfail
description: M5 real-device E2E deterministic middle-node failure fixture
business_key_policy:
  type: explicit
max_active_runs: 1
network_lock:
  lease_duration_sec: 60
  heartbeat_interval_sec: 15
nodes:
  - id: n1_extract
    job_id: m5_shared_read
    sql: jobs/midfail-n1-extract.sql
    depends_on: []
    trigger_rule: all_success
    idempotent: true
  - id: n2_fail
    job_id: m5_midfail_assert
    sql: jobs/midfail-n2-fail.sql
    depends_on: [n1_extract]
    trigger_rule: all_success
    idempotent: true
  - id: n3_finalize
    job_id: m5_midfail_finalize
    sql: jobs/midfail-n3-finalize.sql
    depends_on: [n2_fail]
    trigger_rule: all_success
    idempotent: true
