<!-- kintoneプラグイン設定画面はこのファイルの中身をkintone側ページへ埋め込む。
     完全なHTML文書(doctype宣言やhtml/head/bodyタグ)にするとDOMが展開されないため、
     フラグメントのみ記述する(2026-09-01実機)。 -->
<main class="ksql-flownet-config">
  <h1>kSQL-FlowNet Run状況 設定</h1>
  <p>
    通常は空欄で関連レコード一覧から自動検出します。上書きしたい場合のみ入力してください。
  </p>
  <form id="ksql-flownet-config-form">
    <label for="ksql-flownet-audit-app-id">監査履歴アプリID</label>
    <input
      id="ksql-flownet-audit-app-id"
      name="auditAppId"
      type="text"
      inputmode="numeric"
      autocomplete="off"
    />
    <label for="ksql-flownet-request-app-id">操作要求アプリID(任意)</label>
    <input
      id="ksql-flownet-request-app-id"
      name="requestAppId"
      type="text"
      inputmode="numeric"
      autocomplete="off"
    />
    <label for="ksql-flownet-log-app-id">JOBログアプリID(任意)</label>
    <input
      id="ksql-flownet-log-app-id"
      name="logAppId"
      type="text"
      inputmode="numeric"
      autocomplete="off"
    />
    <p id="ksql-flownet-config-error" class="ksql-flownet-config-error"></p>
    <div class="ksql-flownet-config-actions">
      <button type="submit">保存</button>
      <button id="ksql-flownet-config-cancel" type="button">キャンセル</button>
    </div>
  </form>
</main>
